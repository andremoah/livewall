<!-- Synthetic stand-in for VS Code's workbench.html - see test/smoke.js for what it is for. -->
<!-- Deliberately free of the tokens the patcher searches for, so this comment cannot be -->
<!-- mistaken for the document it describes. -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					amdLoader
					defaultWorkerFactory
					dompurify
				;
			"
		/>
		<meta
			http-equiv="Content-Type"
			content="text/html;charset=utf-8"
		/>
	</head>

	<body aria-label=""></body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
