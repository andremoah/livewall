name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No workbench.html on a runner, so the patcher half self-skips. The runtime, media
      # and source parsing checks are the ones that catch regressions anyway.
      - run: node test/smoke.js
