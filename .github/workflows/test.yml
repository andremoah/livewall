name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Node inside the Electron that VS Code 1.13x ships.
          node-version: 22
      # Everything runs here now: the patcher works against a committed workbench.html
      # fixture rather than needing a real installation, which it used to, so the code that
      # edits the user's VS Code was the one piece with no CI coverage at all.
      - run: node test/smoke.js
